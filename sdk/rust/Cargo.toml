[package]
name = "threadweave-protocols"
version = "1.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Prost messages and Tonic gRPC bindings for the ThreadWeave protocols"
repository = "https://github.com/threadweave-dev/ThreadWeave-protocols"
keywords = ["threadweave", "protobuf", "grpc", "tonic"]
categories = ["api-bindings", "network-programming"]
include = ["build.rs", "src/**", "proto/**"]

[dependencies]
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
