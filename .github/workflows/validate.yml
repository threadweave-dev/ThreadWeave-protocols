name: Validate protocols

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Verify formatting
        run: buf format --diff --exit-code

      - name: Lint
        run: buf lint

      - name: Generate bindings
        run: buf generate

      - name: Detect breaking-change baseline
        if: github.event_name == 'pull_request'
        id: baseline
        shell: bash
        run: |
          if git ls-tree -r "origin/${{ github.event.repository.default_branch }}" -- proto | grep -q '\.proto$'; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Default branch has no Protobuf baseline; skipping the bootstrap comparison."
          fi

      - name: Check breaking changes
        if: github.event_name == 'pull_request' && steps.baseline.outputs.available == 'true'
        run: buf breaking --against '.git#ref=refs/remotes/origin/${{ github.event.repository.default_branch }}'
