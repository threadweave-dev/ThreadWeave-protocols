version: v2
modules:
  - path: proto
    name: buf.build/threadweave/protocols
lint:
  use:
    - STANDARD
  except:
    # RuntimeEvent and WorkerCommand intentionally describe the two directions
    # of the long-lived stream and are clearer public API names than wrappers.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
