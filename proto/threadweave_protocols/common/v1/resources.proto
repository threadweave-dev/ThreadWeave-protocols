syntax = "proto3";

package threadweave_protocols.common.v1;

// ResourceRequirements describes requested or available compute resources.
message ResourceRequirements {
  // CPU capacity in thousandths of a CPU core.
  uint64 cpu_millicores = 1;
  // Memory capacity in bytes.
  uint64 memory_bytes = 2;
  // Number of GPU devices.
  uint32 gpu_count = 3;
  // GPU memory capacity in bytes.
  uint64 gpu_memory_bytes = 4;
  // Ephemeral storage capacity in bytes.
  uint64 storage_bytes = 5;
  // Network capacity in bits per second.
  uint64 network_bits_per_second = 6;
  // Implementation-defined consumable resources.
  map<string, uint64> custom_quantities = 7;
  // Qualitative properties that must be present on an eligible worker.
  repeated string required_capabilities = 8;
}
