syntax = "proto3";

package threadweave_protocols.runtime.v1;

import "google/protobuf/timestamp.proto";
import "threadweave_protocols/common/v1/errors.proto";
import "threadweave_protocols/common/v1/metadata.proto";
import "threadweave_protocols/common/v1/resources.proto";
import "threadweave_protocols/execution/v1/execution.proto";
import "threadweave_protocols/execution/v1/jobs.proto";
import "threadweave_protocols/execution/v1/results.proto";
import "threadweave_protocols/runtime/v1/heartbeat.proto";

// A command sent by the Worker over a persistent runtime session.
message WorkerCommand {
  oneof payload {
    AssignExecutionRequest assign_execution = 1;
    CancelExecution cancel_execution = 2;
  }
}

message CancelExecution {
  string assignment_id = 1;
  string execution_id = 2;
  optional string reason = 3;
}

// An event observed by a language runtime. The Worker remains authoritative
// for lifecycle state and validates all execution sequence numbers.
message RuntimeEvent {
  oneof payload {
    RuntimeReady ready = 1;
    ExecutionStarted execution_started = 2;
    ExecutionProgress execution_progress = 3;
    ExecutionMetrics execution_metrics = 4;
    ExecutionCompleted execution_completed = 5;
    ExecutionFailed execution_failed = 6;
    RuntimeHeartbeat heartbeat = 7;
  }
}

message RuntimeReady {
  string runtime_id = 1;
}

message ExecutionStarted {
  string assignment_id = 1;
  string execution_id = 2;
  uint64 sequence_number = 3;
  google.protobuf.Timestamp observed_at = 4;
}

message ExecutionProgress {
  string assignment_id = 1;
  string execution_id = 2;
  uint64 sequence_number = 3;
  double progress = 4;
  google.protobuf.Timestamp observed_at = 5;
}

message ExecutionMetrics {
  string assignment_id = 1;
  string execution_id = 2;
  uint64 sequence_number = 3;
  optional uint64 elapsed_ms = 4;
  optional uint64 deserialization_ms = 5;
  optional uint64 execution_ms = 6;
  optional uint64 serialization_ms = 7;
  optional double progress = 8;
  map<string, double> custom_metrics = 9;
}

message ExecutionCompleted {
  string assignment_id = 1;
  string execution_id = 2;
  uint64 sequence_number = 3;
  threadweave_protocols.execution.v1.JobResult result = 4;
  google.protobuf.Timestamp observed_at = 5;
}

message ExecutionFailed {
  string assignment_id = 1;
  string execution_id = 2;
  uint64 sequence_number = 3;
  threadweave_protocols.common.v1.Error failure = 4;
  google.protobuf.Timestamp observed_at = 5;
}

message ExecutorDescriptor {
  string executor_id = 1;
  string runtime = 2;
  string implementation_version = 3;
  repeated string serialization_formats = 4;
  repeated string capabilities = 5;
  uint32 concurrency_limit = 6;
}

message WorkerRegistration {
  string worker_id = 1;
  optional string node_id = 2;
  string generation = 3;
  string implementation_version = 4;
  repeated string protocol_versions = 5;
  string endpoint = 6;
  repeated ExecutorDescriptor executors = 7;
  threadweave_protocols.common.v1.ResourceRequirements capacity = 8;
  threadweave_protocols.common.v1.Metadata metadata = 9;
}

message AssignExecutionRequest {
  string assignment_id = 1;
  string execution_id = 2;
  string job_id = 3;
  threadweave_protocols.execution.v1.TaskIdentity task = 4;
  bytes arguments = 5;
  string serialization_format = 6;
  threadweave_protocols.common.v1.ResourceRequirements reserved_resources = 7;
  optional google.protobuf.Timestamp deadline = 8;
  threadweave_protocols.common.v1.Metadata metadata = 9;
}

message AssignExecutionResponse {
  string assignment_id = 1;
  bool accepted = 2;
  optional string rejection_code = 3;
}

message ReportExecutionRequest {
  string report_id = 1;
  string assignment_id = 2;
  string execution_id = 3;
  uint64 sequence_number = 4;
  threadweave_protocols.execution.v1.ExecutionState state = 5;
  threadweave_protocols.execution.v1.JobResult outcome = 6;
  google.protobuf.Timestamp observed_at = 7;
}
