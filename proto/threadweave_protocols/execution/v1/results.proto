syntax = "proto3";

package threadweave_protocols.execution.v1;

import "threadweave_protocols/artifacts/v1/artifacts.proto";
import "threadweave_protocols/common/v1/errors.proto";

// JobResult contains output or failure details for a completed job.
message JobResult {
  // Opaque, externally serialized inline result payload.
  bytes payload = 1;
  // Serialization format used for payload.
  string serialization_format = 2;
  // Reference to externally stored result content, when present.
  threadweave_protocols.artifacts.v1.ArtifactReference artifact = 3;
  // Structured failure details, when the job failed.
  threadweave_protocols.common.v1.Error failure = 4;
  // Execution attempt that produced this outcome.
  string execution_id = 5;
  // Additional externally stored result content.
  repeated threadweave_protocols.artifacts.v1.ArtifactReference artifacts = 6;
}
