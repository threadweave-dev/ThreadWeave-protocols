syntax = "proto3";

package threadweave_protocols.artifacts.v1;

import "threadweave_protocols/common/v1/metadata.proto";
import "google/protobuf/timestamp.proto";

// ArtifactReference identifies externally stored content.
message ArtifactReference {
  // Stable artifact identifier.
  string artifact_id = 1;
  // Location from which the artifact can be obtained.
  string uri = 2;
  // IANA media type of the artifact.
  string media_type = 3;
  // Artifact size in bytes.
  uint64 size_bytes = 4;
  // Checksum of the content, including an algorithm prefix when applicable.
  string checksum = 5;
  // Extensible artifact attributes.
  threadweave_protocols.common.v1.Metadata metadata = 6;
  repeated ArtifactLocation locations = 7;
}

message ArtifactLocation {
  string uri = 1;
  optional string credential_reference = 2;
  google.protobuf.Timestamp observed_at = 3;
  optional google.protobuf.Timestamp expires_at = 4;
  threadweave_protocols.common.v1.Metadata metadata = 5;
}

message ArtifactResidency {
  string artifact_id = 1;
  string worker_id = 2;
  string location = 3;
  google.protobuf.Timestamp observed_at = 4;
  google.protobuf.Timestamp expires_at = 5;
}
